project: polygon-strike
version: 0.5.1
non_negotiable_invariants:
  - "Browser-only prototype: no backend required"
  - "Campaign contains exactly four stages and each stage lasts exactly 60 seconds"
  - "Boss phase begins near 50 seconds; stage progression occurs at 60 seconds even if the boss remains alive"
  - "Stage 1 is EARTH SURFACE and all stage backgrounds scroll continuously without resetting worldScroll"
  - "Background composition uses deterministic varied map segments rather than one repeating strip"
  - "Earth surface map includes changing terrain biomes, a curving road, a varying river, and landmarks"
  - "Stage 2 through 4 backgrounds include richer depth cues such as planets/nebulae, layered flagship hull structures, and enclosed corridor ceiling/wall details"
  - "Air enemy roster includes interceptor, fighter, dart, raider, bomber, and beamfighter archetypes"
  - "Enemy archetypes have visibly different movement patterns including hunter, weave, dash, cross, orbit, and stalk"
  - "Player keeps pulse fire on Space/J; holding L charges the player laser before a fixed-duration firing window"
  - "Player laser requires a full charge, fires for a bounded active duration, then requires recharging"
  - "Player laser deals repeated forward beam damage and is blocked by indestructible armor plates"
  - "Beamfighter, later-stage laser turrets, and bosses can use charge-then-fire beam weapons"
  - "Enemy laser uses a warning/charge phase before the damaging beam phase"
  - "Each stage can expose one optional original GOLDEN SCOUT hidden character encounter; discovering it grants bonus score but is never required for progression"
  - "Indestructible rotating armor plates remain indestructible to pulse fire and laser fire"
  - "Ground enemies remain destroyable by player pulse fire using X/Z planar targeting"
  - "Invincibility remains toggleable with I and continue remains available with C after game over"
  - "B toggles BGM independently; M remains master audio mute; T toggles texture mapping"
  - "Gameplay simulation remains fixed-step catch-up to reduce slow-motion during frame drops"
  - "Craft silhouettes and audiovisual assets remain original and must not copy proprietary game assets"
  - "Core math, map generation, enemy movement, and beam rules remain independently testable with Node.js"
  - "check_harness.cmd must provide baseline validation on Windows even when Node.js is not installed"
  - "When Node.js is unavailable but Edge or Chrome is installed, check_harness.cmd must execute browser-based JavaScript core tests"