project: polygon-strike
version: 0.4.2
non_negotiable_invariants:
  - "Browser-only prototype: no backend required"
  - "Left/right input moves the craft laterally within the visible play field"
  - "Up/W means forward movement by increasing world Z; Down/S means backward movement by decreasing world Z"
  - "Player and airborne enemies share the configured flightPlaneY"
  - "Ground enemies exist on groundPlaneY and can be destroyed by player laser fire using X/Z planar targeting"
  - "Indestructible rotating armor plates cannot be destroyed by player fire and damage the player on contact"
  - "Campaign contains exactly four stages and each stage lasts exactly 60 seconds"
  - "Boss phase begins near 50 seconds; the stage always advances at 60 seconds whether or not the boss is defeated"
  - "Stage 1 is EARTH SURFACE and visually represents flight over Earth's ground rather than Earth seen from orbit"
  - "Background/world scrolling is continuous and worldScroll is not reset at stage transitions"
  - "Stage backdrop changes use a scrolling crossfade transition rather than an abrupt hard switch"
  - "Stage difficulty increases through enemy speed, spawn rate, projectile rate, ground-enemy rate, and boss HP"
  - "Air enemies, ground turrets, and bosses can fire enemy projectiles toward the player"
  - "I toggles invincible mode; while enabled, damage events do not reduce player lives"
  - "Game over offers continue; continue restarts the current stage with three lives while preserving score and worldScroll"
  - "B toggles BGM independently while M remains the master audio mute"
  - "T toggles procedural texture mapping on/off without changing gameplay rules"
  - "Gameplay simulation uses fixed-step catch-up updates so temporary frame drops do not create prolonged slow-motion"
  - "Particle and enemy-projectile counts are bounded to avoid runaway render/update cost"
  - "Player, enemies, ground installations, bosses, and large ship surfaces retain filled low-poly rendering in both texture modes"
  - "Craft silhouettes may evoke 1980s polygon shooters but must not copy proprietary models, textures, UI assets, music, sound effects, or other protected game assets"
  - "BGM and sound effects are original procedural Web Audio synthesis and require no external audio assets"
  - "Core math and campaign rules remain independently testable with Node.js"
  - "check_harness.cmd must provide baseline validation on Windows even when Node.js is not installed"
  - "When Node.js is unavailable but Edge or Chrome is installed, check_harness.cmd must execute browser-based JavaScript core tests instead of warning-only fallback"
