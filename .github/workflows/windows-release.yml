name: Windows EXE

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run game regression harness
        shell: cmd
        run: check_harness.cmd

      - name: Restore Windows wrapper
        run: dotnet restore src/PolygonStrike.Windows/PolygonStrike.Windows.csproj

      - name: Publish single-file Windows x64 EXE
        run: >-
          dotnet publish src/PolygonStrike.Windows/PolygonStrike.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output artifacts/win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify single-file output and smoke test
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "artifacts/win-x64" -File)
          $exe = $files | Where-Object { $_.Name -eq "PolygonStrike.exe" } | Select-Object -First 1
          if ($null -eq $exe -or $exe.Length -le 0) {
            $names = ($files | ForEach-Object Name) -join ", "
            throw "PolygonStrike.exe was not produced. Files: $names"
          }

          & $exe.FullName --smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged EXE smoke test failed with exit code $LASTEXITCODE."
          }

          Copy-Item $exe.FullName "artifacts/POLYGON-STRIKE-win-x64.exe" -Force

      - name: Determine release metadata
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: release_info
        shell: pwsh
        run: |
          [xml]$project = Get-Content "src/PolygonStrike.Windows/PolygonStrike.Windows.csproj"
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "PolygonStrike.Windows.csproj does not contain Version."
          }

          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $tag = "v$version-build.$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release and mark Latest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release_info.outputs.tag }}"
          $version = "${{ steps.release_info.outputs.version }}"
          $shortSha = "${{ steps.release_info.outputs.short_sha }}"
          $asset = "artifacts/POLYGON-STRIKE-win-x64.exe"

          gh release create $tag $asset `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "POLYGON STRIKE v$version ($shortSha)" `
            --generate-notes `
            --latest
