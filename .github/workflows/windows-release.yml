name: Windows EXE

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Run game regression harness
        shell: cmd
        run: check_harness.cmd

      - name: Restore Windows wrapper
        run: dotnet restore src/PolygonStrike.Windows/PolygonStrike.Windows.csproj --runtime win-x64

      - name: Publish single-file Windows x64 EXE
        run: >-
          dotnet publish src/PolygonStrike.Windows/PolygonStrike.Windows.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output artifacts/win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify single-file runtime payload and smoke test
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "artifacts/win-x64" -File)
          $runtimeFiles = @($files | Where-Object { $_.Extension -ne ".xml" })
          $exe = $runtimeFiles | Where-Object { $_.Name -eq "PolygonStrike.exe" } | Select-Object -First 1
          if ($runtimeFiles.Count -ne 1 -or $null -eq $exe -or $exe.Length -le 0) {
            $names = ($runtimeFiles | ForEach-Object Name) -join ", "
            throw "Single-file runtime payload must contain exactly one non-empty PolygonStrike.exe. Runtime files: $names"
          }

          $smoke = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test" -PassThru -Wait
          if ($smoke.ExitCode -ne 0) {
            throw "Packaged EXE smoke test failed with exit code $($smoke.ExitCode)."
          }

          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Copy-Item $exe.FullName "artifacts/release/POLYGON-STRIKE-win-x64.exe" -Force

      - name: Upload release asset
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: polygon-strike-windows
          path: artifacts/release/POLYGON-STRIKE-win-x64.exe
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: polygon-strike-windows
          path: artifacts/release

      - name: Determine release metadata
        id: release_info
        shell: pwsh
        run: |
          [xml]$project = Get-Content "src/PolygonStrike.Windows/PolygonStrike.Windows.csproj"
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "PolygonStrike.Windows.csproj does not contain Version."
          }

          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $tag = "v$version-build.$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release and mark Latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.release_info.outputs.tag }}"
          $version = "${{ steps.release_info.outputs.version }}"
          $shortSha = "${{ steps.release_info.outputs.short_sha }}"
          $asset = "artifacts/release/POLYGON-STRIKE-win-x64.exe"

          gh release create $tag $asset `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "POLYGON STRIKE v$version ($shortSha)" `
            --generate-notes `
            --latest
