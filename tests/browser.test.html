<!doctype html>
<meta charset="utf-8">
<title>Polygon Strike browser tests</title>
<body>RUNNING</body>
<script src="../src/game-core.js"></script>
<script>
(() => {
  'use strict';
  const C = window.PolygonStrikeCore;
  function assert(condition, message) {
    if (!condition) throw new Error(message);
  }
  try {
    assert(C && C.VERSION === '0.2.0', 'VERSION mismatch');
    assert(C.clamp(12, -2, 5) === 5, 'clamp upper bound failed');
    assert(C.clamp(-8, -2, 5) === -2, 'clamp lower bound failed');
    const near = C.project3D({x:2,y:0,z:10},{cx:100,cy:100},500);
    const far = C.project3D({x:2,y:0,z:40},{cx:100,cy:100},500);
    assert(Math.abs(near.x-100) > Math.abs(far.x-100), 'perspective failed');
    const pitch = C.CONFIG.cameraPitchDeg * Math.PI / 180;
    const chaseNear = C.projectChase3D({x:2,y:5,z:14},{cx:100,cy:140},500,pitch);
    const chaseFar = C.projectChase3D({x:2,y:5,z:60},{cx:100,cy:140},500,pitch);
    assert(chaseFar.scale < chaseNear.scale, 'chase perspective failed');
    assert(chaseFar.y < chaseNear.y, 'horizon convergence failed');
    assert(C.spheresHit({x:0,y:0,z:10},{x:1,y:0,z:11}), 'collision true case failed');
    assert(!C.spheresHit({x:0,y:0,z:10},{x:8,y:0,z:11}), 'collision false case failed');
    assert(C.scoreForEnemy({kind:'fighter'}) === 100, 'fighter score failed');
    assert(C.scoreForEnemy({kind:'dart'}) === 150, 'dart score failed');
    const seq=[0.75,0.5,0.25,0.5,0.5]; let i=0;
    const enemy=C.makeEnemy(7,()=>seq[i++%seq.length]);
    assert(enemy.id===7, 'enemy id failed');
    assert(enemy.z===C.CONFIG.enemySpawnZ, 'enemy spawn Z failed');
    document.body.textContent='PASS: browser core tests';
    document.body.dataset.status='pass';
  } catch (error) {
    document.body.textContent='FAIL: ' + error.message;
    document.body.dataset.status='fail';
  }
})();
</script>
