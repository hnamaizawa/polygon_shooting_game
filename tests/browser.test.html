<!doctype html>
<meta charset="utf-8">
<title>Polygon Strike browser tests</title>
<body>RUNNING</body>
<script src="../src/game-core.js"></script>
<script>
(() => {
  'use strict';
  const C=window.PolygonStrikeCore;
  function assert(condition,message){if(!condition)throw new Error(message);}
  try {
    assert(C&&C.VERSION==='0.3.1','VERSION mismatch');
    assert(C.clamp(12,-2,5)===5,'clamp upper bound failed');
    const near=C.project3D({x:2,y:0,z:10},{cx:100,cy:100},500);
    const far=C.project3D({x:2,y:0,z:40},{cx:100,cy:100},500);
    assert(Math.abs(near.x-100)>Math.abs(far.x-100),'perspective failed');
    const pitch=C.CONFIG.cameraPitchDeg*Math.PI/180;
    const chaseNear=C.projectChase3D({x:2,y:C.CONFIG.flightPlaneY,z:14},{cx:100,cy:140},C.CONFIG.cameraFocal,pitch,C.CONFIG.cameraBackOffset);
    const chaseFar=C.projectChase3D({x:2,y:C.CONFIG.flightPlaneY,z:60},{cx:100,cy:140},C.CONFIG.cameraFocal,pitch,C.CONFIG.cameraBackOffset);
    assert(chaseFar.scale<chaseNear.scale,'chase perspective failed');
    assert(C.CONFIG.cameraPitchDeg>=30&&C.CONFIG.cameraBackOffset>0,'rear elevated camera config failed');
    const start={x:0,y:C.CONFIG.flightPlaneY,z:9};
    const forward=C.movePlayer(start,{forward:true},.5);
    const backward=C.movePlayer(start,{backward:true},.5);
    assert(forward.z>start.z,'forward depth control failed');
    assert(backward.z<start.z,'backward depth control failed');
    assert(forward.y===C.CONFIG.flightPlaneY&&backward.y===C.CONFIG.flightPlaneY,'player flight plane failed');
    const seq=[0.75,0.5,0.25,0.5,0.5];let i=0;
    const enemy=C.makeEnemy(7,()=>seq[i++%seq.length]);
    assert(enemy.y===C.CONFIG.flightPlaneY,'enemy flight plane failed');
    assert(C.spheresHit({x:0,y:0,z:10},{x:1,y:0,z:11}),'collision true case failed');
    assert(!C.spheresHit({x:0,y:0,z:10},{x:8,y:0,z:11}),'collision false case failed');
    document.body.textContent='PASS: browser core tests';
    document.body.dataset.status='pass';
  } catch(error) {
    document.body.textContent='FAIL: '+error.message;
    document.body.dataset.status='fail';
  }
})();
</script>
