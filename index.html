<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>POLYGON STRIKE v0.4.1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <canvas id="game" width="960" height="640" aria-label="3D polygon space shooter"></canvas>
    <section id="startPanel" class="panel">
      <h1>POLYGON STRIKE</h1>
      <p class="version">v0.4.1</p>
      <p>4ステージ構成のオリジナル3Dポリゴン・シューティングです。</p>
      <p><b>左右:</b> ← → / A D　<b>前後:</b> ↑ ↓ / W S　<b>射撃:</b> Space / J</p>
      <p><b>BGM:</b> B　<b>テクスチャ:</b> T　<b>全音声:</b> M</p>
      <button id="startButton">MISSION START</button>
    </section>
  </main>
  <script src="src/game-core.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
