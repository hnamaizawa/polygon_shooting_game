<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>POLYGON STRIKE v0.3.1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <canvas id="game" width="960" height="640" aria-label="3D polygon space shooter"></canvas>
    <section id="startPanel" class="panel">
      <h1>POLYGON STRIKE</h1>
      <p class="version">v0.3.1</p>
      <p>1980年代の3Dポリゴン・シューティングを意識した、オリジナルの宇宙戦ゲームです。</p>
      <p><b>左右:</b> ← → / A D　<b>前進・後退:</b> ↑ ↓ / W S　<b>射撃:</b> Space / J　<b>消音:</b> M</p>
      <button id="startButton">MISSION START</button>
    </section>
  </main>
  <script src="src/game-core.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
